# ─────────────────────────────────────────────────────────────────────────────
# Paste this block into your bot's credentials.yml to expose the custom
# `websockets` voice channel that the orb connects to.
#
# Prerequisite: copy channels/websockets.py into your bot so it is importable at
# the dotted path below. If you place it at <bot>/channels/websockets.py (with an
# __init__.py in that folder), the path is `channels.websockets.WebSocketsInputChannel`.
#
# ── ASR / TTS: reuse what your bot already uses ──────────────────────────────
# The speech provider is project-specific. This channel runs on the same
# `voice_stream` stack as Rasa Inspector's voice mode, so the simplest correct
# config is to COPY the `asr:` and `tts:` blocks your bot already uses for voice
# (e.g. the ones under the `inspector:` entry in this same credentials.yml, or
# whatever channel you demo voice with today). If voice works in Inspector, that
# config works here — no new provider needed.
#
# The Deepgram blocks below are only an EXAMPLE. Azure is shown commented as an
# alternative. Any ASR/TTS Rasa Pro supports works (installed here: ASR =
# deepgram, azure; TTS = deepgram, azure, cartesia, rime).
# ─────────────────────────────────────────────────────────────────────────────

channels.websockets.WebSocketsInputChannel:
  server_url: 0.0.0.0
  interruptions:
    enabled: true
    min_words: 1

  # ↓↓↓ Replace these two blocks with your bot's existing voice ASR/TTS config ↓↓↓
  asr:
    # --- Example: Deepgram (needs DEEPGRAM_API_KEY) ---
    name: deepgram
    language_map:
      en-US:
        language: en
        model: flux-general-en
    eager_eot_threshold: 0.8
    eot_threshold: 0.8
    eot_timeout_ms: 1500
    # --- Example: Azure (needs AZURE_SPEECH_KEY / region) ---
    # name: azure
    # speech_region: westeurope
    # language_map:
    #   en-US:
    #     language: en-US
  tts:
    # --- Example: Deepgram ---
    name: deepgram
    endpoint: wss://api.deepgram.com/v1/speak
    model: aura-2-asteria-en
    min_chunk_length: 30
    # --- Example: Azure ---
    # name: azure
    # speech_region: westeurope
    # language_map:
    #   en-US:
    #     language: en-US
    #     voice: en-US-JennyNeural
  # ↑↑↑ Replace these two blocks with your bot's existing voice ASR/TTS config ↑↑↑

  # Conversational flow management (barge-in / filler / turn detection). Optional —
  # remove this block to use channel defaults.
  cfm:
    enabled: true
    barge_in:
      enabled: true
      model: anthropic/claude-haiku-4-5-20251001
      model_timeout_ms: 1500
      sustained_word_threshold: 2
